name: Build & Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0"
          fi
          echo "VERSION=$V" >> $GITHUB_ENV

      - name: Build
        run: dotnet build src/DeadLogo.csproj -c Release -o out -p:Version=${{ env.VERSION }}

      - name: Package
        run: |
          mkdir -p pkg/addons/counterstrikesharp/plugins/GamePointLogo
          cp out/GamePointLogo.dll pkg/addons/counterstrikesharp/plugins/GamePointLogo/

          mkdir -p pkg/addons/counterstrikesharp/configs/plugins/GamePointLogo/templates
          cp configs/*.json pkg/addons/counterstrikesharp/configs/plugins/GamePointLogo/templates/

          (cd pkg && zip -r ../GamePointLogo-${{ env.VERSION }}.zip .)

          mkdir -p addon
          cp -r panorama addon/
          (cd addon && zip -r ../GamePointLogo-addon-${{ env.VERSION }}.zip .)

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: CS2-DeadLogo-*.zip

      - name: Upload test build
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: CS2-DeadLogo-test
          path: CS2-DeadLogo-*.zip
